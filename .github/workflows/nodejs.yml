name: build nodejs

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 0"   # weekly rebuild (Sunday 06:00 UTC) to pick up base-image patches
  push:
    branches:
      - main
    paths:
      - nodejs/**
      - .github/workflows/nodejs.yml

permissions:
  contents: read
  packages: write

jobs:
  push:
    name: "yolks:nodejs_${{ matrix.tag }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tag:
          - 12
          - 14
          - 15
          - 16
          - 17
          - 18
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase owner
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./nodejs
          file: ./nodejs/${{ matrix.tag }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.name }}/yolks:nodejs_${{ matrix.tag }}
          cache-from: type=gha,scope=nodejs-${{ matrix.tag }}
          cache-to: type=gha,scope=nodejs-${{ matrix.tag }},mode=max
